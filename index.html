<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GourmetAI - Dijital Şef Asistanı</title>
    
    <!-- PWA ve Mobil Başlık Ayarları -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e65100">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1830/1830839.png">

    <!-- Modern Font ve Markdown Parse Kütüphanesi -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #e65100;
            --primary-light: #fff3e0;
            --bg-color: #f8f9fa;
            --chat-bg: #ffffff;
            --text-dark: #2c3e50;
            --user-bubble: #1e293b;
            --bot-bubble: #fff8f1;
            --border-color: #ffe0b2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        header {
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            font-size: 28px;
        }

        .brand-text h1 {
            font-size: 18px;
            color: var(--primary);
            font-weight: 700;
        }

        .brand-text p {
            font-size: 11px;
            color: #64748b;
        }

        .upload-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-color);
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 88%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: #fff;
            border: 1px solid #e2e8f0;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: var(--bot-bubble);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .recipe-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(0,0,0,0.08);
            display: block;
        }

        .bubble h1, .bubble h2, .bubble h3 {
            font-size: 15px;
            margin: 10px 0 6px 0;
            color: var(--primary);
        }

        .bubble ul, .bubble ol {
            padding-left: 18px;
            margin-bottom: 8px;
        }

        .bubble p {
            margin-bottom: 8px;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .input-area {
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid #edf2f7;
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }

        .input-area input:focus {
            border-color: var(--primary);
        }

        .input-area button {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .message {
                max-width: 92%;
            }
            .recipe-img {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">
            <span class="brand-logo">👨‍🍳</span>
            <div class="brand-text">
                <h1>GourmetAI</h1>
                <p>70B Akıllı Mutfak Robotu</p>
            </div>
        </div>
        <button class="upload-btn">📄 Tarif Listesi</button>
    </header>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            <div class="avatar">👨‍🍳</div>
            <div class="bubble">
                Merhaba! Ben dijital şef asistanınız. Yemeklerin yapılışları, tarifler ve mutfak sırları hakkında bana her şeyi sorabilirsiniz! 🍲
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Tarif veya yemek adı yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">➔</button>
    </div>
</div>

<script>
    // Service Worker Kaydı (Mobil Uygulama Desteği)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('✅ Service Worker Kayıtlı!'))
                .catch(err => console.log('❌ SW Hatası:', err));
        });
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        appendMessage("user", message);
        input.value = "";

        const loadingId = appendMessage("bot", "<i>Şef düşünüyor, tarif hazırlanıyor... 👨‍🍳</i>");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            
            document.getElementById(loadingId).remove();
            appendBotResponse(data.reply, data.image_url);

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("bot", "⚠️ Bir bağlantı hatası oluştu. Lütfen tekrar deneyin.");
        }
    }

    function appendMessage(sender, text) {
        const chatBox = document.getElementById("chatBox");
        const msgId = "msg-" + Date.now();
        const avatar = sender === "user" ? "👤" : "👨‍🍳";
        
        const html = `
            <div class="message ${sender}" id="${msgId}">
                <div class="avatar">${avatar}</div>
                <div class="bubble">${text}</div>
            </div>
        `;
        
        chatBox.insertAdjacentHTML("beforeend", html);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgId;
    }

    function appendBotResponse(replyText, imageUrl) {
        const chatBox = document.getElementById("chatBox");
        const msgId = "msg-" + Date.now();
        
        const formattedText = marked.parse(replyText);
        
        let imageHtml = "";
        if (imageUrl) {
            imageHtml = `<img src="${imageUrl}" class="recipe-img" alt="Yemek Görseli" onerror="this.style.display='none'">`;
        }

        const html = `
            <div class="message bot" id="${msgId}">
                <div class="avatar">👨‍🍳</div>
                <div class="bubble">
                    ${imageHtml}
                    <div>${formattedText}</div>
                </div>
            </div>
        `;
        
        chatBox.insertAdjacentHTML("beforeend", html);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
