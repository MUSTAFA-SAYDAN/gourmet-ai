<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GourmetAI - Dijital Mutfak Asistanı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .recipe-image {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
    </style>
    <!-- PWA Manifest ve Mobil Uyumluluk Etiketleri -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448609.png">
</head>

<body class="bg-[#faf9f6] text-[#2d2a26] min-h-screen flex flex-col justify-between">

    <!-- 🍽️ HEADER -->
    <header class="bg-white border-b border-orange-100 shadow-xs py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-3xl">👨‍🍳</span>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-orange-600">GourmetAI</h1>
                <p class="text-xs text-gray-400">70B Akıllı Mutfak Robotu</p>
            </div>
        </div>

        <!-- Dosya Yükleme Alanı -->
        <div class="flex items-center gap-2">
            <label
                class="cursor-pointer bg-orange-50 hover:bg-orange-100 border border-orange-200 text-orange-700 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
                📄 Tarif Listesi Yükle
                <input type="file" id="menuFileInput" accept=".txt" class="hidden" onchange="uploadMenuFile()">
            </label>
            <span id="uploadStatus" class="text-xs font-medium text-gray-500"></span>
        </div>
    </header>

    <!-- 💬 CHAT ARENASI -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-between overflow-hidden">

        <!-- Hoş Geldiniz Kartı / Chat Geçmişi -->
        <div id="chatWindow"
            class="flex-1 bg-white border border-gray-100 rounded-2xl shadow-sm p-4 md:p-6 overflow-y-auto chat-scroll flex flex-col gap-4 mb-4">

            <!-- Karşılama Mesajı -->
            <div class="flex gap-3 max-w-[85%] self-start">
                <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-sm shadow-xs">👨‍🍳
                </div>
                <div
                    class="bg-orange-50 text-gray-800 rounded-2xl rounded-tl-xs p-4 border border-orange-100/50 text-sm leading-relaxed shadow-xs">
                    Merhaba! Ben restoranımızın dijital şef asistanıyım. Tarif listemizi yukarıdan yüklediyseniz,
                    yemeklerin yapılışları, malzemeleri ve gizli lezzet sırları hakkında bana her şeyi sorabilirsiniz!
                    🍲
                </div>
            </div>

        </div>

        <!-- İNPUT ALANI -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-md p-2 flex items-center gap-2">
            <input type="text" id="userInput" placeholder="Şefe bir soru sorun... (Örn: Hünkar beğendi nasıl yapılır?)"
                class="flex-1 bg-transparent px-4 py-3 text-sm text-gray-800 focus:outline-hidden"
                onkeydown="if(event.key === 'Enter') sendMessage()">

            <button onclick="sendMessage()"
                class="bg-orange-600 hover:bg-orange-700 text-white px-5 py-3 rounded-xl text-sm font-semibold tracking-wide transition shadow-sm cursor-pointer">
                Sor
            </button>
        </div>

    </main>

    <!-- 🖥️ JAVASCRIPT MOTORU -->
    <script>
        const chatWindow = document.getElementById("chatWindow");
        const userInput = document.getElementById("userInput");

        function appendUserMessage(text) {
            const msgHtml = `
                <div class="flex gap-3 max-w-[85%] self-end flex-row-reverse">
                    <div class="w-8 h-8 rounded-full bg-gray-800 text-white flex items-center justify-center shrink-0">👤</div>
                    <div class="bg-gray-800 text-white rounded-2xl rounded-tr-xs p-4">
                        ${text}
                    </div>
                </div>`;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendBotMessage(text, imageUrl = null) {
            let imgHtml = "";
            if (imageUrl) {
                imgHtml = `<img src="${imageUrl}" class="recipe-image" alt="Tarif Görseli" loading="lazy" />`;
            }

            const formattedText = (text || "").replace(/\n/g, '<br>');

            const msgHtml = `
                <div class="flex gap-3 max-w-[85%] self-start">
                    <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center shrink-0">👨‍🍳</div>
                    <div class="bg-orange-50 text-gray-800 rounded-2xl rounded-tl-xs p-4 border border-orange-100/50">
                        ${imgHtml}
                        <div>${formattedText}</div>
                    </div>
                </div>`;

            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendLoadingMessage() {
            const id = "loading_" + Date.now();
            const msgHtml = `
                <div id="${id}" class="flex gap-3 max-w-[85%] self-start items-center">
                    <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center shrink-0">👨‍🍳</div>
                    <div class="text-xs text-gray-400 font-medium flex items-center gap-1.5">
                        <span class="animate-bounce">●</span>
                        <span class="animate-bounce [animation-delay:0.2s]">●</span>
                        <span class="animate-bounce [animation-delay:0.4s]">●</span>
                    </div>
                </div>`;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            appendUserMessage(question);
            userInput.value = "";

            const loadingId = appendLoadingMessage();

            try {
                const response = await fetch(`/ask?question=${encodeURIComponent(question)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                if (response.ok) {
                    appendBotMessage(data.reply || data.answer, data.image_url);
                } else {
                    appendBotMessage("Üzgünüm, şu an mutfakta bir sorun oluştu.");
                }
            } catch (error) {
                console.error("Sorgu hatası:", error);
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                appendBotMessage("Sunucuya bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.");
            }
        }

        // Enter tuşu ile gönderme desteği
        if (userInput) {
            userInput.addEventListener("keypress", function (e) {
                if (e.key === "Enter") {
                    sendMessage();
                }
            });
        }

        // PWA Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Kaydedildi!'))
                    .catch(err => console.log('PWA Hatasi:', err));
            });
        }
    </script>
</body>
</html>
